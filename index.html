<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4a3aa7">
<title>PSYC3204 Sınıf Uygulamaları</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%234a3aa7%22%2F%3E%3Cpath%20d%3D%22M18%2044h28M22%2044V26M32%2044V18M42%2044V32%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f6;
  --surface:#fdfdfe;
  --surface-2:#ebebf1;
  --surface-3:#dfdfe8;
  --ink:#14131b;
  --ink-2:#4a4957;
  --muted:#65636f;
  --line:#e0dfe7;
  --line-strong:#c3c2ce;
  --accent:#4a3aa7;
  --accent-hover:#3c2f8e;
  --accent-ink:#ffffff;
  --accent-soft:#e9e6f8;
  --good:#0ca30c;
  --good-text:#006300;
  --good-soft:#e1f3e1;
  --crit:#d03b3b;
  --crit-text:#a82626;
  --crit-soft:#fbe5e5;
  --warn:#fab219;
  --warn-soft:#fdf0cc;
  --series-1:#2a78d6;
  --series-2:#eb6834;
  --stage:#15141c;
  --stage-ink:#f3f3f7;
  --shadow:0 1px 2px rgba(20,19,27,.05),0 8px 24px rgba(20,19,27,.07);
  --radius:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f0f14;
    --surface:#18181f;
    --surface-2:#22222b;
    --surface-3:#2e2e39;
    --ink:#f3f3f7;
    --ink-2:#c4c3cf;
    --muted:#9896a6;
    --line:#2b2b35;
    --line-strong:#41414d;
    --accent:#9d93ee;
    --accent-hover:#b3abf3;
    --accent-ink:#14131b;
    --accent-soft:#2b2847;
    --good-text:#5fd35f;
    --good-soft:#17301a;
    --crit-text:#ff8f8f;
    --crit-soft:#3a1d20;
    --warn-soft:#3b3119;
    --series-1:#3987e5;
    --series-2:#d95926;
    --stage:#0b0b10;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0f14;
  --surface:#18181f;
  --surface-2:#22222b;
  --surface-3:#2e2e39;
  --ink:#f3f3f7;
  --ink-2:#c4c3cf;
  --muted:#9896a6;
  --line:#2b2b35;
  --line-strong:#41414d;
  --accent:#9d93ee;
  --accent-hover:#b3abf3;
  --accent-ink:#14131b;
  --accent-soft:#2b2847;
  --good-text:#5fd35f;
  --good-soft:#17301a;
  --crit-text:#ff8f8f;
  --crit-soft:#3a1d20;
  --warn-soft:#3b3119;
  --series-1:#3987e5;
  --series-2:#d95926;
  --stage:#0b0b10;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
ul,ol{margin:0}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:680px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;min-height:40px;padding:0 4px;border-radius:8px}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.05em;cursor:pointer;color:var(--ink-2);min-height:34px;min-width:44px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* page */
.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:grid;gap:18px}
.head{display:grid;gap:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(26px,7vw,34px);font-weight:750;letter-spacing:-.015em}
.lead{color:var(--ink-2);font-size:16px}
.card,[id^="quiz"]{scroll-margin-top:72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:14px}
.card h2{font-size:19px;font-weight:700}
.card h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.foot{max-width:680px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 28px);font-size:13px;color:var(--muted)}
.list{padding-left:20px;display:grid;gap:6px}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;min-height:48px;font-weight:650;font-size:16px;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* segmented tabs */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 6px;min-height:48px;font-size:14px;font-weight:650;color:var(--ink-2);cursor:pointer;line-height:1.2}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .n{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* quiz */
.progress{display:grid;gap:6px}
.progress-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.q-text{font-size:18px;font-weight:600;line-height:1.4}
.q-sub{font-size:15px;color:var(--ink-2)}
.choices{display:grid;gap:10px}
.choice{appearance:none;text-align:left;width:100%;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;min-height:56px;font-size:16px;font-weight:550;cursor:pointer;line-height:1.35}
.choice:hover{border-color:var(--accent)}
.choice .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.choice[disabled]{cursor:default}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .mark{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--crit);background:var(--crit-soft)}
.choice.wrong .mark{background:var(--crit);border-color:var(--crit);color:#fff}
.choice.dim{opacity:.6}
.feedback{border-radius:14px;padding:12px 14px;display:grid;gap:4px;font-size:15px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--crit-soft)}
.feedback.info{background:var(--surface-2)}
.feedback b{font-size:16px}
.feedback.ok b{color:var(--good-text)}
.feedback.no b{color:var(--crit-text)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.review{list-style:none;padding:0;display:grid;border-top:1px solid var(--line)}
.review li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.review .ans{color:var(--ink-2);font-size:14px}
.ico{width:20px;height:20px;flex:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

.weeks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.wk{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.wk-n{grid-row:span 3;font-family:var(--mono);font-weight:700;font-size:15px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.wk.now .wk-n{background:var(--accent);color:var(--accent-ink)}
.wk-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--muted)}
.wk-now{font-weight:700;color:var(--accent)}
.wk-topic{font-weight:650;font-size:16px;line-height:1.35}
.wk-apps{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.app-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);font-weight:650;font-size:15px;text-decoration:none;background:var(--surface)}
.app-link:hover{background:var(--accent-soft)}
.app-link svg{width:16px;height:16px}
.soon{font-size:14px;color:var(--muted)}
.app-pair{display:inline-flex;align-items:stretch;gap:6px}
.qr-btn{appearance:none;width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.qr-btn:hover{border-color:var(--accent);color:var(--accent)}
.qr-ico{width:18px;height:18px}
.qr-overlay{position:fixed;inset:0;z-index:50;background:rgba(10,10,16,.62);display:grid;place-items:center;padding:16px}
.qr-box{background:var(--surface);border-radius:20px;padding:20px;width:min(560px,100%);max-height:100%;overflow:auto;display:grid;gap:10px;box-shadow:var(--shadow)}
.qr-box h2{font-size:22px}
.qr-img{background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center}
.qr-img svg{width:100%;height:auto;max-width:min(64vh,480px);display:block}
.qr-url{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
body.qr-open{overflow:hidden}

</style>
</head>
<body>
<div class="topbar"><div class="topbar-in"><span class="back" aria-hidden="true" style="cursor:default">PSYC3204 · PSKO3204</span><div class="lang" role="group" aria-label="Language / Dil"><button type="button" data-lang-btn="tr" lang="tr" aria-pressed="false">TR</button><button type="button" data-lang-btn="en" lang="en" aria-pressed="false">EN</button></div></div></div>
<main class="app">
  <header class="head">
    <p class="eyebrow" data-t="eyebrow">PSKO3204 · Sınıf uygulamaları</p>
    <h1 data-t="h1">Haftalık uygulamalar</h1>
    <p class="lead" data-t="lead">Derste hocanın söylediği uygulamayı aç. Her şey telefonunda çalışır; yanıtların hiçbir yere gönderilmez.</p>
    <div class="row"><button type="button" class="btn" id="qrPageBtn"><svg class="qr-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 2h6v6H2zM12 2h6v6h-6zM2 12h6v6H2z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 12h2.5v2.5H12zM15.5 15.5H18V18h-2.5zM15.5 12H18v2h-2.5zM12 15.5h2V18h-2z" fill="currentColor"/></svg><span data-t="qrPage">Bu sayfanın QR kodu</span></button></div>
  </header>
  <ol class="weeks" id="weeks"></ol>
</main>
<footer class="foot"><p data-t="privacy"></p><p class="small" data-t="credits"></p></footer>
<div class="qr-overlay" id="qrOverlay" hidden>
  <div class="qr-box" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <p class="eyebrow" id="qrWeek"></p>
    <h2 id="qrTitle"></h2>
    <div class="qr-img" id="qrImg"></div>
    <p class="small" id="qrScan"></p>
    <p class="qr-url mono" id="qrUrl"></p>
    <p class="note" id="qrNote" hidden></p>
    <button type="button" class="btn primary block" id="qrClose"></button>
  </div>
</div>

<script>
/* PSYC3204 phone-app kit: language, helpers, tabs, quiz */
const Kit = (() => {
  'use strict';
  const KEY = 'psyc3204.lang';
  const subs = [];
  let lang = 'tr';
  try {
    const p = new URLSearchParams(location.search).get('lang');
    if (p === 'tr' || p === 'en') lang = p;
    else {
      let s = null;
      try { s = localStorage.getItem(KEY); } catch (e) { s = null; }
      if (s === 'tr' || s === 'en') lang = s;
      else lang = (navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en';
    }
  } catch (e) { lang = 'tr'; }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const t = v => (v == null ? '' : typeof v === 'string' ? v : (v[lang] != null ? v[lang] : (v.en || '')));
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  function apply() {
    document.documentElement.lang = lang;
    const S = (window.STR && window.STR[lang]) || {};
    $$('[data-t]').forEach(el => { const v = S[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
    $$('[data-lang-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.langBtn === lang)));
    $$('a[data-keep-lang]').forEach(a => {
      const href = a.getAttribute('href') || '';
      const [base, hash] = href.split('#');
      a.setAttribute('href', base.split('?')[0] + '?lang=' + lang + (hash ? '#' + hash : ''));
    });
    if (S.docTitle) document.title = S.docTitle;
  }
  function setLang(l) {
    if (l === lang) return;
    lang = l;
    try { localStorage.setItem(KEY, l); } catch (e) { /* storage unavailable */ }
    try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u.toString()); } catch (e) { /* file:// or sandbox */ }
    apply();
    subs.forEach(f => { try { f(l); } catch (e) { console.error(e); } });
  }
  function onLang(f) { subs.push(f); }

  function shuffle(a, rnd) {
    const r = rnd || Math.random;
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
    return b;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let q = Math.imul(a ^ a >>> 15, 1 | a);
      q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q;
      return ((q ^ q >>> 14) >>> 0) / 4294967296;
    };
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };

  const ICON = {
    ok: '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" style="fill:var(--good)"/><path d="M5.8 10.3l2.8 2.8 5.6-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    no: '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" style="fill:var(--crit)"/><path d="M6.8 6.8l6.4 6.4M13.2 6.8l-6.4 6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
    info: '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.2" fill="none" style="stroke:var(--muted)" stroke-width="1.6"/><path d="M10 9v5" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="6.3" r="1.2" style="fill:var(--muted)"/></svg>'
  };

  /* Tabs: buttons [role=tab][data-panel]; remembers the part in the URL hash (#p1, #p2...) */
  function tabs(nav, onChange) {
    const btns = $$('[role="tab"]', nav);
    function select(id, push) {
      btns.forEach(b => {
        const on = b.dataset.panel === id;
        b.setAttribute('aria-selected', String(on));
        b.tabIndex = on ? 0 : -1;
        const p = document.getElementById(b.dataset.panel);
        if (p) p.hidden = !on;
      });
      if (push) { try { history.replaceState(null, '', '#' + id); } catch (e) { /* ignore */ } }
      if (onChange) onChange(id);
    }
    btns.forEach((b, k) => {
      b.addEventListener('click', () => { select(b.dataset.panel, true); });
      b.addEventListener('keydown', e => {
        const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        const nb = btns[(k + d + btns.length) % btns.length];
        nb.focus(); select(nb.dataset.panel, true);
      });
    });
    const h = (location.hash || '').slice(1);
    select(btns.some(b => b.dataset.panel === h) ? h : btns[0].dataset.panel, false);
    return { select };
  }

  /* Quiz: one question at a time, instant feedback, summary with review */
  function quiz(root, cfg) {
    const items = cfg.items;
    const L = cfg.labels;
    const st = { i: 0, picks: new Array(items.length).fill(null) };
    function score() { return st.picks.reduce((s, p, k) => s + (p === items[k].answer ? 1 : 0), 0); }
    function render(focusFirst) {
      if (st.i >= items.length) return renderSummary();
      const it = items[st.i];
      const pick = st.picks[st.i];
      const answered = pick !== null;
      const opts = it.options || cfg.options;
      let h = `<div class="progress"><div class="progress-top"><span>${esc(t(L.question))} ${st.i + 1} / ${items.length}</span><span>${esc(t(L.correctSoFar))}: ${score()}</span></div><div class="bar"><i style="width:${(st.i / items.length) * 100}%"></i></div></div>`;
      if (it.pre) h += `<p class="q-sub">${esc(t(it.pre))}</p>`;
      h += `<p class="q-text" tabindex="-1">${esc(t(it.q))}</p>`;
      if (cfg.prompt) h += `<p class="q-sub">${esc(t(cfg.prompt))}</p>`;
      h += `<div class="choices">`;
      opts.forEach((o, k) => {
        let cls = 'choice', mark = String.fromCharCode(65 + k);
        if (answered) {
          if (k === it.answer) { cls += ' correct'; mark = '✓'; }
          else if (k === pick) { cls += ' wrong'; mark = '✗'; }
          else cls += ' dim';
        }
        h += `<button type="button" class="${cls}" data-k="${k}"${answered ? ' disabled' : ''}><span class="mark" aria-hidden="true">${mark}</span><span>${esc(t(o))}</span></button>`;
      });
      h += `</div>`;
      if (answered) {
        const ok = pick === it.answer;
        const head = ok ? t(L.right) : t(L.notQuite) + ' ' + t(L.bestAnswer) + ': ' + t(opts[it.answer]) + '.';
        h += `<div class="feedback ${ok ? 'ok' : 'no'}" role="status"><b>${esc(head)}</b><span>${esc(t(it.explain))}</span></div>`;
        h += `<div class="row end"><button type="button" class="btn primary" data-next>${esc(t(st.i === items.length - 1 ? L.finish : L.next))}</button></div>`;
      }
      root.innerHTML = h;
      root.querySelectorAll('.choice:not([disabled])').forEach(b => b.addEventListener('click', () => {
        st.picks[st.i] = +b.dataset.k;
        render();
        const fb = root.querySelector('.feedback');
        if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        if (cfg.onAnswer) cfg.onAnswer(st.i, st.picks[st.i] === it.answer);
      }));
      const nx = root.querySelector('[data-next]');
      if (nx) nx.addEventListener('click', () => { st.i++; render(true); root.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
      if (focusFirst) { const q = root.querySelector('.q-text'); if (q) q.focus({ preventScroll: true }); }
    }
    function renderSummary() {
      const s = score();
      let h = `<div class="score"><span class="big">${s} / ${items.length}</span><span class="muted">${esc(t(L.correctTotal))}</span></div>`;
      if (cfg.summaryNote) h += `<p class="note">${esc(t(cfg.summaryNote))}</p>`;
      h += `<ul class="review">`;
      items.forEach((it, k) => {
        const opts = it.options || cfg.options;
        const ok = st.picks[k] === it.answer;
        h += `<li>${ok ? ICON.ok : ICON.no}<div><div>${esc(t(it.short || it.q))}</div><div class="ans">${esc(t(L.bestAnswer))}: ${esc(t(opts[it.answer]))}</div></div></li>`;
      });
      h += `</ul><div class="row"><button type="button" class="btn" data-restart>${esc(t(L.restart))}</button></div>`;
      root.innerHTML = h;
      root.querySelector('[data-restart]').addEventListener('click', () => { st.i = 0; st.picks.fill(null); render(true); });
      if (cfg.onFinish) cfg.onFinish(s, items.length);
    }
    onLang(() => render());
    render();
    return { restart() { st.i = 0; st.picks.fill(null); render(); } };
  }

  const QUIZ_LABELS = {
    question: { en: 'Question', tr: 'Soru' },
    correctSoFar: { en: 'Correct', tr: 'Doğru' },
    right: { en: 'Correct!', tr: 'Doğru!' },
    notQuite: { en: 'Not quite.', tr: 'Tam değil.' },
    bestAnswer: { en: 'Best answer', tr: 'En iyi yanıt' },
    next: { en: 'Next', tr: 'Sonraki' },
    finish: { en: 'See results', tr: 'Sonucu gör' },
    correctTotal: { en: 'correct', tr: 'doğru' },
    restart: { en: 'Start again', tr: 'Baştan başla' }
  };

  const COMMON = {
    en: { back: 'All weeks', privacy: 'Your answers stay on this phone. Nothing is sent anywhere.' },
    tr: { back: 'Tüm haftalar', privacy: 'Yanıtların bu telefonda kalır, hiçbir yere gönderilmez.' }
  };
  function withCommon(s) { return { en: Object.assign({}, COMMON.en, s.en), tr: Object.assign({}, COMMON.tr, s.tr) }; }

  function init() {
    $$('[data-lang-btn]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.langBtn)));
    apply();
  }
  return { get lang() { return lang; }, withCommon, t, esc, $, $$, apply, setLang, onLang, shuffle, mulberry32, store, ICON, tabs, quiz, QUIZ_LABELS, init };
})();

</script>
<script>
(() => {
'use strict';
const { t, esc } = Kit;
window.STR = Kit.withCommon({
  en: {
    docTitle: 'PSYC3204 Class Apps',
    eyebrow: 'PSYC3204 · Class apps',
    h1: 'Weekly apps',
    lead: 'Open the app your instructor names. Everything runs on your phone; your answers are not sent anywhere.',
    qrPage: 'QR code for this page',
    credits: 'QR codes are drawn with qrcode-generator by Kazuhiko Arase (MIT License).'
  },
  tr: {
    docTitle: 'PSKO3204 Sınıf Uygulamaları',
    eyebrow: 'PSKO3204 · Sınıf uygulamaları',
    h1: 'Haftalık uygulamalar',
    lead: 'Derste hocanın söylediği uygulamayı aç. Her şey telefonunda çalışır; yanıtların hiçbir yere gönderilmez.',
    qrPage: 'Bu sayfanın QR kodu',
    credits: 'QR kodları, Kazuhiko Arase’nin qrcode-generator kütüphanesiyle çiziliyor (MIT lisansı).'
  }
});
const W = (n, date, en, tr, apps, status) => ({ n, date, topic: { en, tr }, apps: apps || [], status: status || (apps && apps.length ? 'ready' : 'soon') });
const A = (file, en, tr) => ({ file, title: { en, tr } });
const WEEKS = [
  W(1, '2026-09-23', 'Introduction; testing and assessment', 'Giriş; test ve değerlendirme',
    [A('h01-stroop.html', 'Stroop task', 'Stroop görevi'), A('h01-test-mi.html', 'Test or assessment?', 'Test mi, değerlendirme mi?')]),
  W(2, '2026-09-30', 'History, culture, and ethics', 'Tarih, kültür ve etik',
    [A('h02-tarih-etik.html', 'History and ethics', 'Tarih ve etik')]),
  W(3, '2026-10-07', 'Assumptions, norms, and standardization', 'Varsayımlar, normlar ve standardizasyon',
    [A('h03-normlar.html', 'Norms and constructs', 'Normlar ve yapılar')]),
  W(4, '2026-10-14', 'Scales of measurement; writing items', 'Ölçek düzeyleri; madde yazımı'),
  W(5, '2026-10-21', 'Face and content validity; response styles', 'Görünüş ve kapsam geçerliği; yanıt stilleri'),
  W(6, '2026-10-28', 'Holiday (no class)', 'Tatil (ders yok)', [], 'none'),
  W(7, '2026-11-04', 'Correlation; reliability; peer panel', 'Korelasyon; güvenirlik; akran paneli',
    [A('h07-alfa-lab.html', 'Cronbach’s alpha lab', 'Cronbach alfa laboratuvarı'), A('h01-stroop.html', 'Stroop task (retest)', 'Stroop görevi (tekrar)')]),
  W(8, '2026-11-11', 'Midterm exam', 'Ara sınav', [], 'none'),
  W(9, '2026-11-18', 'Validity II; in-class pilot', 'Geçerlik II; sınıf içi pilot'),
  W(10, '2026-11-25', 'Item analysis and test revision', 'Madde analizi ve test revizyonu',
    [A('h07-alfa-lab.html', 'Cronbach’s alpha lab', 'Cronbach alfa laboratuvarı')]),
  W(11, '2026-12-02', 'Intelligence', 'Zekâ'),
  W(12, '2026-12-09', 'Personality assessment; project presentations (1)', 'Kişilik değerlendirmesi; proje sunumları (1)'),
  W(13, '2026-12-16', 'Test showcase; project presentations (2)', 'Test vitrini; proje sunumları (2)'),
  W(14, '2026-12-23', 'Project presentations (3); course overview', 'Proje sunumları (3); dönem toparlaması', [], 'none')
];
const S2 = {
  en: { week: 'Week', soon: 'Coming soon', none: 'No app this week', now: 'This week', qrFor: x => `QR code: ${x}`, close: 'Close', scan: 'Scan with your phone camera to open:', hubTitle: 'All weekly apps',
        fileNote: 'The QR code works once the apps are published online. This page was opened from a file on a computer, so phones cannot open its address.' },
  tr: { week: 'Hafta', soon: 'Yakında', none: 'Bu hafta uygulama yok', now: 'Bu hafta', qrFor: x => `QR kodu: ${x}`, close: 'Kapat', scan: 'Açmak için telefonunun kamerasıyla tara:', hubTitle: 'Tüm haftalık uygulamalar',
        fileNote: 'QR kodu, uygulamalar internette yayınlandıktan sonra çalışır. Bu sayfa bilgisayardaki bir dosyadan açıldığı için telefonlar bu adresi açamaz.' }
};
const ARROW = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const QR_ICON = '<svg class="qr-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 2h6v6H2zM12 2h6v6h-6zM2 12h6v6H2z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 12h2.5v2.5H12zM15.5 15.5H18V18h-2.5zM15.5 12H18v2h-2.5zM12 15.5h2V18h-2z" fill="currentColor"/></svg>';
let qrReturn = null;
function appUrl(file) {
  const u = new URL(file, location.href);
  u.search = '?lang=' + Kit.lang;
  u.hash = '';
  return u.href;
}
function openQr(file, title, weekLabel, trigger) {
  const L = S2[Kit.lang];
  const url = appUrl(file);
  document.getElementById('qrWeek').textContent = weekLabel;
  document.getElementById('qrTitle').textContent = title;
  document.getElementById('qrUrl').textContent = url;
  document.getElementById('qrScan').textContent = L.scan;
  document.getElementById('qrClose').textContent = L.close;
  const img = document.getElementById('qrImg');
  const note = document.getElementById('qrNote');
  const isFile = location.protocol === 'file:';
  note.hidden = !isFile;
  note.textContent = isFile ? L.fileNote : '';
  try {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    img.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 3, scalable: true, alt: title });
  } catch (e) {
    img.textContent = url;
  }
  img.style.opacity = isFile ? '.35' : '1';
  qrReturn = trigger || null;
  document.getElementById('qrOverlay').hidden = false;
  document.body.classList.add('qr-open');
  document.getElementById('qrClose').focus();
}
function closeQr() {
  document.getElementById('qrOverlay').hidden = true;
  document.body.classList.remove('qr-open');
  if (qrReturn) qrReturn.focus();
}
function fmtDate(iso) { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; }
function currentWeek() {
  // A class is on Wednesday; its week runs from Monday 00:00 to the next Monday 00:00.
  const now = Date.now();
  const hit = WEEKS.find(w => {
    const wed = new Date(w.date + 'T00:00:00').getTime();
    return now >= wed - 2 * 864e5 && now < wed + 5 * 864e5;
  });
  return hit ? hit.n : null;
}
function render() {
  const L = S2[Kit.lang];
  const cur = currentWeek();
  document.getElementById('weeks').innerHTML = WEEKS.map(w => {
    const now = w.n === cur;
    let apps;
    if (w.status === 'ready') apps = `<div class="wk-apps">${w.apps.map(a => `<span class="app-pair"><a class="app-link" href="${a.file}?lang=${Kit.lang}">${esc(t(a.title))}${ARROW}</a><button type="button" class="qr-btn" data-file="${a.file}" data-week="${w.n}" aria-label="${esc(L.qrFor(t(a.title)))}">${QR_ICON}</button></span>`).join('')}</div>`;
    else apps = `<p class="soon">${esc(w.status === 'none' ? L.none : L.soon)}</p>`;
    return `<li class="wk${now ? ' now' : ''}" id="w${w.n}"><span class="wk-n" aria-hidden="true">${String(w.n).padStart(2, '0')}</span>`
      + `<div class="wk-meta"><span>${esc(L.week)} ${w.n} · ${fmtDate(w.date)}</span>${now ? `<span class="wk-now">${esc(L.now)}</span>` : ''}</div>`
      + `<div class="wk-topic">${esc(t(w.topic))}</div>${apps}</li>`;
  }).join('');
}
Kit.init();
render();
Kit.onLang(render);
document.getElementById('weeks').addEventListener('click', e => {
  const b = e.target.closest('.qr-btn');
  if (!b) return;
  const w = WEEKS.find(x => x.n === +b.dataset.week);
  const a = w.apps.find(x => x.file === b.dataset.file);
  openQr(a.file, t(a.title), `${S2[Kit.lang].week} ${w.n}`, b);
});
document.getElementById('qrPageBtn').addEventListener('click', e => openQr('index.html', S2[Kit.lang].hubTitle, 'PSYC3204 · PSKO3204', e.currentTarget));
document.getElementById('qrClose').addEventListener('click', closeQr);
document.getElementById('qrOverlay').addEventListener('click', e => { if (e.target.id === 'qrOverlay') closeQr(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('qrOverlay').hidden) closeQr(); });
const cur = currentWeek();
if (cur && cur > 2) { const el = document.getElementById('w' + cur); if (el) el.scrollIntoView({ block: 'center' }); }
})();

</script>
