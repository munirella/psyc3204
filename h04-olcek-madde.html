<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4a3aa7">
<title>Ölçek Düzeyleri ve Maddeler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%234a3aa7%22%2F%3E%3Cpath%20d%3D%22M18%2044h28M22%2044V26M32%2044V18M42%2044V32%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f6;
  --surface:#fdfdfe;
  --surface-2:#ebebf1;
  --surface-3:#dfdfe8;
  --ink:#14131b;
  --ink-2:#4a4957;
  --muted:#65636f;
  --line:#e0dfe7;
  --line-strong:#c3c2ce;
  --accent:#4a3aa7;
  --accent-hover:#3c2f8e;
  --accent-ink:#ffffff;
  --accent-soft:#e9e6f8;
  --good:#0ca30c;
  --good-text:#006300;
  --good-soft:#e1f3e1;
  --crit:#d03b3b;
  --crit-text:#a82626;
  --crit-soft:#fbe5e5;
  --warn:#fab219;
  --warn-soft:#fdf0cc;
  --series-1:#2a78d6;
  --series-2:#eb6834;
  --stage:#15141c;
  --stage-ink:#f3f3f7;
  --shadow:0 1px 2px rgba(20,19,27,.05),0 8px 24px rgba(20,19,27,.07);
  --radius:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f0f14;
    --surface:#18181f;
    --surface-2:#22222b;
    --surface-3:#2e2e39;
    --ink:#f3f3f7;
    --ink-2:#c4c3cf;
    --muted:#9896a6;
    --line:#2b2b35;
    --line-strong:#41414d;
    --accent:#9d93ee;
    --accent-hover:#b3abf3;
    --accent-ink:#14131b;
    --accent-soft:#2b2847;
    --good-text:#5fd35f;
    --good-soft:#17301a;
    --crit-text:#ff8f8f;
    --crit-soft:#3a1d20;
    --warn-soft:#3b3119;
    --series-1:#3987e5;
    --series-2:#d95926;
    --stage:#0b0b10;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0f14;
  --surface:#18181f;
  --surface-2:#22222b;
  --surface-3:#2e2e39;
  --ink:#f3f3f7;
  --ink-2:#c4c3cf;
  --muted:#9896a6;
  --line:#2b2b35;
  --line-strong:#41414d;
  --accent:#9d93ee;
  --accent-hover:#b3abf3;
  --accent-ink:#14131b;
  --accent-soft:#2b2847;
  --good-text:#5fd35f;
  --good-soft:#17301a;
  --crit-text:#ff8f8f;
  --crit-soft:#3a1d20;
  --warn-soft:#3b3119;
  --series-1:#3987e5;
  --series-2:#d95926;
  --stage:#0b0b10;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
ul,ol{margin:0}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:680px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;min-height:40px;padding:0 4px;border-radius:8px}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.05em;cursor:pointer;color:var(--ink-2);min-height:34px;min-width:44px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* page */
.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:grid;gap:18px}
.head{display:grid;gap:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(26px,7vw,34px);font-weight:750;letter-spacing:-.015em}
.lead{color:var(--ink-2);font-size:16px}
.card,[id^="quiz"]{scroll-margin-top:72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:14px}
.card h2{font-size:19px;font-weight:700}
.card h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.foot{max-width:680px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 28px);font-size:13px;color:var(--muted)}
.list{padding-left:20px;display:grid;gap:6px}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;min-height:48px;font-weight:650;font-size:16px;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* segmented tabs */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 6px;min-height:48px;font-size:14px;font-weight:650;color:var(--ink-2);cursor:pointer;line-height:1.2}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .n{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* quiz */
.progress{display:grid;gap:6px}
.progress-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.q-text{font-size:18px;font-weight:600;line-height:1.4}
.q-sub{font-size:15px;color:var(--ink-2)}
.choices{display:grid;gap:10px}
.choice{appearance:none;text-align:left;width:100%;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;min-height:56px;font-size:16px;font-weight:550;cursor:pointer;line-height:1.35}
.choice:hover{border-color:var(--accent)}
.choice .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.choice[disabled]{cursor:default}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .mark{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--crit);background:var(--crit-soft)}
.choice.wrong .mark{background:var(--crit);border-color:var(--crit);color:#fff}
.choice.dim{opacity:.6}
.feedback{border-radius:14px;padding:12px 14px;display:grid;gap:4px;font-size:15px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--crit-soft)}
.feedback.info{background:var(--surface-2)}
.feedback b{font-size:16px}
.feedback.ok b{color:var(--good-text)}
.feedback.no b{color:var(--crit-text)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.review{list-style:none;padding:0;display:grid;border-top:1px solid var(--line)}
.review li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.review .ans{color:var(--ink-2);font-size:14px}
.ico{width:20px;height:20px;flex:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

.stack{display:grid;gap:18px}
.item-quote{font-size:18px;font-weight:600;line-height:1.4;border-left:4px solid var(--accent);padding:4px 0 4px 12px}
.fix{display:grid;gap:4px;border-radius:12px;background:var(--good-soft);padding:10px 12px;font-size:15px}
.fix b{color:var(--good-text)}
.prompt{font-family:var(--mono);font-size:13.5px;line-height:1.45;background:var(--surface-2);border-radius:12px;padding:10px 12px;color:var(--ink-2)}
details.cmp{border:1px solid var(--line);border-radius:14px;padding:0}
details.cmp summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:700;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.cmp summary::-webkit-details-marker{display:none}
details.cmp summary::after{content:'+';font-family:var(--mono);font-size:20px;color:var(--accent)}
details.cmp[open] summary::after{content:'–'}
.pairs{list-style:none;margin:0;padding:0 16px 14px;display:grid;gap:10px}
.pairs li{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px;font-size:14.5px}
.pairs .theme{font-weight:700;font-size:15px}
.pairs .ab{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;color:var(--ink-2)}
.pairs .tag{font-family:var(--mono);font-weight:700;color:var(--accent)}
.count{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em}
.scale{display:grid;gap:8px}
.scale .choice{min-height:52px}
.lk{display:grid;gap:6px;margin:6px 0 14px}
.lk-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk-row button{appearance:none;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:12px;min-height:46px;font-size:17px;font-weight:700;cursor:pointer}
.lk-row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.lk-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.res{display:grid;gap:12px}
.res .card{margin:0}
.bands{display:grid;grid-template-columns:6fr 5fr 6fr;gap:4px;margin:8px 0}
.bands span{border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.bands span.on{background:var(--accent);color:#fff}
.ips{display:grid;gap:8px;margin:8px 0}
.ips-row{display:grid;grid-template-columns:110px 1fr 28px;align-items:center;gap:8px;font-size:15px}
.ips-bar{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.ips-bar i{display:block;height:100%;background:var(--accent)}
.pair{display:grid;gap:6px;margin:6px 0 14px}
.grp-badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:14px;width:max-content}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in"><a class="back" href="index.html" data-keep-lang><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="back">Tüm haftalar</span></a><div class="lang" role="group" aria-label="Language / Dil"><button type="button" data-lang-btn="tr" lang="tr" aria-pressed="false">TR</button><button type="button" data-lang-btn="en" lang="en" aria-pressed="false">EN</button></div></div></div>
<main class="app">
  <header class="head">
    <p class="eyebrow" data-t="eyebrow"></p>

  <nav class="seg" role="tablist" aria-label="Parts">

    <button type="button" role="tab" id="tab-p2" data-panel="p2" aria-controls="p2"><span class="n">2</span><span data-t="tab2"></span></button>
    <button type="button" role="tab" id="tab-p3" data-panel="p3" aria-controls="p3"><span class="n">3</span><span data-t="tab3"></span></button>
    <button type="button" role="tab" id="tab-p4" data-panel="p4" aria-controls="p4"><span class="n">4</span><span data-t="tab4"></span></button>
  </nav>

  <section id="p1" role="tabpanel" aria-labelledby="tab-p1" class="card">

      <div class="card">
        <h2 data-t="scTitle"></h2>

        <div id="sc" aria-live="polite"></div>
      </div>
      <div class="card">
        <h2 data-t="sqTitle"></h2>
        <p data-t="sqLead"></p>
        <div id="quizSc"></div>
      </div>
    </div>
  </section>

  <section id="p4" role="tabpanel" aria-labelledby="tab-p4" class="card">

</main>

<script>
/* PSYC3204 phone-app kit: language, helpers, tabs, quiz */
const Kit = (() => {
  'use strict';
  const KEY = 'psyc3204.lang';
  const subs = [];
  let lang = 'tr';
  try {
    const p = new URLSearchParams(location.search).get('lang');
    if (p === 'tr' || p === 'en') lang = p;
    else {
      let s = null;
      try { s = localStorage.getItem(KEY); } catch (e) { s = null; }
      if (s === 'tr' || s === 'en') lang = s;
      else lang = (navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en';
    }
  } catch (e) { lang = 'tr'; }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const t = v => (v == null ? '' : typeof v === 'string' ? v : (v[lang] != null ? v[lang] : (v.en || '')));
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  function apply() {
    document.documentElement.lang = lang;
    const S = (window.STR && window.STR[lang]) || {};
    $$('[data-t]').forEach(el => { const v = S[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
    $$('[data-lang-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.langBtn === lang)));
    $$('a[data-keep-lang]').forEach(a => {
      const href = a.getAttribute('href') || '';
      const [base, hash] = href.split('#');
      a.setAttribute('href', base.split('?')[0] + '?lang=' + lang + (hash ? '#' + hash : ''));
    });
    if (S.docTitle) document.title = S.docTitle;
  }
  function setLang(l) {
    if (l === lang) return;
    lang = l;
    try { localStorage.setItem(KEY, l); } catch (e) { /* storage unavailable */ }
    try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u.toString()); } catch (e) { /* file:// or sandbox */ }
    apply();
    subs.forEach(f => { try { f(l); } catch (e) { console.error(e); } });
  }
  function onLang(f) { subs.push(f); }

  function shuffle(a, rnd) {
    const r = rnd || Math.random;
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
    return b;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let q = Math.imul(a ^ a >>> 15, 1 | a);
      q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q;
      return ((q ^ q >>> 14) >>> 0) / 4294967296;
    };
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };

  const ICON = {
    ok: '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" style="fill:var(--good)"/><path d="M5.8 10.3l2.8 2.8 5.6-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    no: '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" style="fill:var(--crit)"/><path d="M6.8 6.8l6.4 6.4M13.2 6.8l-6.4 6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
    info: '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.2" fill="none" style="stroke:var(--muted)" stroke-width="1.6"/><path d="M10 9v5" style="stroke:var(--muted)" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="6.3" r="1.2" style="fill:var(--muted)"/></svg>'
  };

  /* Tabs: buttons [role=tab][data-panel]; remembers the part in the URL hash (#p1, #p2...) */
  function tabs(nav, onChange) {
    const btns = $$('[role="tab"]', nav);
    function select(id, push) {
      btns.forEach(b => {
        const on = b.dataset.panel === id;
        b.setAttribute('aria-selected', String(on));
        b.tabIndex = on ? 0 : -1;
        const p = document.getElementById(b.dataset.panel);
        if (p) p.hidden = !on;
      });
      if (push) { try { history.replaceState(null, '', '#' + id); } catch (e) { /* ignore */ } }
      if (onChange) onChange(id);
    }
    btns.forEach((b, k) => {
      b.addEventListener('click', () => { select(b.dataset.panel, true); });
      b.addEventListener('keydown', e => {
        const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        const nb = btns[(k + d + btns.length) % btns.length];
        nb.focus(); select(nb.dataset.panel, true);
      });
    });
    const h = (location.hash || '').slice(1);
    select(btns.some(b => b.dataset.panel === h) ? h : btns[0].dataset.panel, false);
    return { select };
  }

  /* Quiz: one question at a time, instant feedback, summary with review */
  function quiz(root, cfg) {
    const items = cfg.items;
    const L = cfg.labels;
    const st = { i: 0, picks: new Array(items.length).fill(null) };
    function score() { return st.picks.reduce((s, p, k) => s + (p === items[k].answer ? 1 : 0), 0); }
    function render(focusFirst) {
      if (st.i >= items.length) return renderSummary();
      const it = items[st.i];
      const pick = st.picks[st.i];
      const answered = pick !== null;
      const opts = it.options || cfg.options;
      let h = `<div class="progress"><div class="progress-top"><span>${esc(t(L.question))} ${st.i + 1} / ${items.length}</span><span>${esc(t(L.correctSoFar))}: ${score()}</span></div><div class="bar"><i style="width:${(st.i / items.length) * 100}%"></i></div></div>`;
      if (it.pre) h += `<p class="q-sub">${esc(t(it.pre))}</p>`;
      h += `<p class="q-text" tabindex="-1">${esc(t(it.q))}</p>`;
      if (cfg.prompt) h += `<p class="q-sub">${esc(t(cfg.prompt))}</p>`;
      h += `<div class="choices">`;
      opts.forEach((o, k) => {
        let cls = 'choice', mark = String.fromCharCode(65 + k);
        if (answered) {
          if (k === it.answer) { cls += ' correct'; mark = '✓'; }
          else if (k === pick) { cls += ' wrong'; mark = '✗'; }
          else cls += ' dim';
        }
        h += `<button type="button" class="${cls}" data-k="${k}"${answered ? ' disabled' : ''}><span class="mark" aria-hidden="true">${mark}</span><span>${esc(t(o))}</span></button>`;
      });
      h += `</div>`;
      if (answered) {
        const ok = pick === it.answer;
        const head = ok ? t(L.right) : t(L.notQuite) + ' ' + t(L.bestAnswer) + ': ' + t(opts[it.answer]) + '.';
        h += `<div class="feedback ${ok ? 'ok' : 'no'}" role="status"><b>${esc(head)}</b><span>${esc(t(it.explain))}</span></div>`;
        h += `<div class="row end"><button type="button" class="btn primary" data-next>${esc(t(st.i === items.length - 1 ? L.finish : L.next))}</button></div>`;
      }
      root.innerHTML = h;
      root.querySelectorAll('.choice:not([disabled])').forEach(b => b.addEventListener('click', () => {
        st.picks[st.i] = +b.dataset.k;
        render();
        const fb = root.querySelector('.feedback');
        if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        if (cfg.onAnswer) cfg.onAnswer(st.i, st.picks[st.i] === it.answer);
      }));
      const nx = root.querySelector('[data-next]');
      if (nx) nx.addEventListener('click', () => { st.i++; render(true); root.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
      if (focusFirst) { const q = root.querySelector('.q-text'); if (q) q.focus({ preventScroll: true }); }
    }
    function renderSummary() {
      const s = score();
      let h = `<div class="score"><span class="big">${s} / ${items.length}</span><span class="muted">${esc(t(L.correctTotal))}</span></div>`;
      if (cfg.summaryNote) h += `<p class="note">${esc(t(cfg.summaryNote))}</p>`;
      h += `<ul class="review">`;
      items.forEach((it, k) => {
        const opts = it.options || cfg.options;
        const ok = st.picks[k] === it.answer;
        h += `<li>${ok ? ICON.ok : ICON.no}<div><div>${esc(t(it.short || it.q))}</div><div class="ans">${esc(t(L.bestAnswer))}: ${esc(t(opts[it.answer]))}</div></div></li>`;
      });
      h += `</ul><div class="row"><button type="button" class="btn" data-restart>${esc(t(L.restart))}</button></div>`;
      root.innerHTML = h;
      root.querySelector('[data-restart]').addEventListener('click', () => { st.i = 0; st.picks.fill(null); render(true); });
      if (cfg.onFinish) cfg.onFinish(s, items.length);
    }
    onLang(() => render());
    render();
    return { restart() { st.i = 0; st.picks.fill(null); render(); } };
  }

  };
  function withCommon(s) { return { en: Object.assign({}, COMMON.en, s.en), tr: Object.assign({}, COMMON.tr, s.tr) }; }

  function init() {
    $$('[data-lang-btn]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.langBtn)));

  }
  return { get lang() { return lang; }, withCommon, t, esc, $, $$, apply, setLang, onLang, shuffle, mulberry32, store, ICON, tabs, quiz, QUIZ_LABELS, init };
})();

// six forced-choice pairs: [scale, statement] vs [scale, statement]; each scale appears four times, total = 6
const PAIRS6 = [[[0, 0], [1, 0]], [[1, 1], [2, 0]], [[2, 1], [0, 1]], [[0, 2], [1, 2]], [[1, 3], [2, 2]], [[2, 3], [0, 3]]];
const REV = [false, false, true, false];
const scState = { lk: [null, null, null, null], fc: new Array(6).fill(null), shown: false };
function renderSc() {
  const S = SC[Kit.lang], root = $('#sc');
  let h = '';
  if (!scState.shown) {
    h += `<h3>${esc(S.step1)}</h3>`;
    S.items.forEach((q, i) => {
      h += `<div class="lk"><p class="item-quote">${i + 1}. ${esc(q)}</p><div class="lk-row" role="group" aria-label="${esc(q)}">`;
      for (let v = 1; v <= 5; v++) h += `<button type="button" data-lk="${i}" data-v="${v}" aria-pressed="${scState.lk[i] === v}">${v}</button>`;
      h += `</div><div class="lk-ends"><span>1 = ${esc(S.ends[0])}</span><span>5 = ${esc(S.ends[1])}</span></div></div>`;
    });
    h += `<h3>${esc(S.step2)}</h3><p class="q-sub">${esc(S.pairAsk)}</p>`;
    PAIRS6.forEach((pr, k) => {
      h += `<div class="pair"><span class="small muted">${k + 1} / 6</span>`;
      pr.forEach((side, j) => {
        const on = scState.fc[k] === j, other = scState.fc[k] !== null && !on;
        h += `<button type="button" class="choice${on ? ' correct' : (other ? ' dim' : '')}" data-fc="${k}" data-j="${j}"><span class="mark" aria-hidden="true">${on ? '✓' : (j ? 'B' : 'A')}</span><span>${esc(S.st[side[0]][side[1]])}</span></button>`;
      });
      h += `</div>`;
    });
    const left = scState.lk.filter(v => v === null).length + scState.fc.filter(v => v === null).length;
    h += left ? `<p class="note">${esc(S.need(left))}</p>` : `<div class="row end"><button type="button" class="btn primary" data-go>${esc(S.go)}</button></div>`;
    root.innerHTML = h;
    root.querySelectorAll('[data-lk]').forEach(b => b.addEventListener('click', () => { scState.lk[+b.dataset.lk] = +b.dataset.v; renderSc(); }));
    root.querySelectorAll('[data-fc]').forEach(b => b.addEventListener('click', () => { scState.fc[+b.dataset.fc] = +b.dataset.j; renderSc(); }));
    const go = root.querySelector('[data-go]');
    if (go) go.addEventListener('click', () => { scState.shown = true; renderSc(); root.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
    return;
  }
  const total = scState.lk.reduce((s, v, i) => s + (REV[i] ? 6 - v : v), 0);
  const cls = total <= 9 ? 0 : total <= 14 ? 1 : 2;
  const ips = [0, 0, 0];
  scState.fc.forEach((j, k) => { ips[PAIRS6[k][j][0]]++; });
  h += `<div class="res">`;
  h += `<div class="card"><h3>${esc(S.cumT)}</h3><div class="score"><span class="big">${total}</span><span class="muted">${esc(S.cumUnit)}</span></div><p>${esc(S.cumX)}</p></div>`;
  h += `<div class="card"><h3>${esc(S.clsT)}</h3><p class="item-quote">${esc(S.clsName[cls])}</p><div class="bands">${S.bands.map((b, i) => `<span class="${i === cls ? 'on' : ''}">${esc(b)}</span>`).join('')}</div><p>${esc(S.clsX)}</p></div>`;
  h += `<div class="card"><h3>${esc(S.ipsT)}</h3><div class="ips">${S.scales.map((n, i) => `<div class="ips-row"><span>${esc(n)}</span><span class="ips-bar"><i style="width:${(ips[i] / 4) * 100}%"></i></span><b class="mono">${ips[i]}</b></div>`).join('')}</div><p>${esc(S.ipsX)}</p><p class="note">${esc(S.hands)}</p></div>`;
  h += `</div><div class="row"><button type="button" class="btn" data-again>${esc(S.again)}</button></div>`;
  root.innerHTML = h;
  root.querySelector('[data-again]').addEventListener('click', () => { scState.lk.fill(null); scState.fc.fill(null); scState.shown = false; renderSc(); });
}
const SCM = [{ en: 'Cumulative', tr: 'Birikimli' }, { en: 'Class (category)', tr: 'Sınıf (kategori)' }, { en: 'Ipsative', tr: 'İpsatif' }];
const sq = [
  { q: { en: 'On a depression screening scale, a total of 20 or more is reported as “clinical range”.', tr: 'Bir depresyon tarama ölçeğinde 20 ve üzeri toplam puan “klinik düzey” olarak raporlanıyor.' }, short: { en: 'Screening cut-off', tr: 'Tarama kesme puanı' }, answer: 1,
    explain: { en: 'A cut-off score turns the total into a category: clinical range or not.', tr: 'Kesme puanı toplamı bir kategoriye çeviriyor: klinik düzey ya da değil.' } },
  { q: { en: 'The total of the 12 items on your project questionnaire: a higher score means a more favorable attitude.', tr: 'Proje ölçeğinizdeki 12 maddenin toplamı: yüksek puan daha olumlu tutum demek.' }, short: { en: 'Project questionnaire total', tr: 'Proje ölçeğinin toplamı' }, answer: 0,
    explain: { en: 'Answers are added up, and more points mean more of the attitude.', tr: 'Yanıtlar toplanıyor; daha çok puan, tutumun daha fazlası demek.' } },
  { q: { en: 'In each question you choose one of two work activities; the result shows the field you are most interested in.', tr: 'Her soruda iki iş etkinliğinden birini seçiyorsunuz; sonuç en çok ilgilendiğiniz alanı gösteriyor.' }, short: { en: 'Choosing between two activities', tr: 'İki etkinlik arasında seçim' }, answer: 2,
    explain: { en: 'Each choice gives a point to one field and none to the other, so the result ranks fields within one person.', tr: 'Her seçim bir alana puan verip ötekine vermiyor; sonuç alanları kişinin kendi içinde sıralıyor.' } },
  { q: { en: 'In a spelling test, each correct word earns 1 point, and the number correct is reported.', tr: 'Bir yazım testinde her doğru sözcük 1 puan; doğru sayısı raporlanıyor.' }, short: { en: 'Spelling test', tr: 'Yazım testi' }, answer: 0,
    explain: { en: 'Points are added up: more correct answers, a higher score.', tr: 'Puanlar toplanıyor: daha çok doğru, daha yüksek puan.' } },
  { q: { en: 'A personality inventory places you in one of four types based on your pattern of answers.', tr: 'Bir kişilik envanteri yanıt örüntünüze göre sizi dört tipten birine yerleştiriyor.' }, short: { en: 'Four personality types', tr: 'Dört kişilik tipi' }, answer: 1,
    explain: { en: 'Your answers place you in a group with others who answered in a similar way.', tr: 'Yanıtlarınız sizi benzer yanıt veren kişilerle aynı gruba yerleştiriyor.' } },
  { q: { en: 'You must choose between two equally positive statements, such as “I am hardworking” and “I am honest”.', tr: '“Çalışkanım” ve “Dürüstüm” gibi eşit derecede olumlu iki ifadeden birini seçmek zorundasınız.' }, short: { en: 'Two equally positive statements', tr: 'Eşit derecede olumlu iki ifade' }, answer: 2,
    explain: { en: 'A forced choice between equally desirable statements; the Edwards Personal Preference Schedule (EPPS) is scored this way.', tr: 'Eşit derecede istenir iki ifade arasında zorunlu seçim; Edwards Kişisel Tercih Envanteri (EPPS) böyle puanlanır.' } }
];

/* ---------- 4. middle option ---------- */
const MKEY = 'psyc3204.h04.mid';

let midPick = null;
const MID = {
  en: { item: '“The food in the campus cafeteria is good.”', group: 'Group',
        A: ['Strongly disagree', 'Disagree', 'Neither agree nor disagree', 'Agree', 'Strongly agree'],
        B: ['Strongly disagree', 'Disagree', 'Agree', 'Strongly agree'],
        sawA: 'You saw five options with a middle option. Group B saw four options and had to lean one way.',
        sawB: 'You saw four options without a middle option. Group A also had “Neither agree nor disagree”.',
        hands: 'When asked in class: Group A, raise your hand if you chose the middle. Group B, raise your hand if it was hard to choose. Where did the undecided people go?',
        rule: 'The response format changes the answers. That is why every project group uses the same 5-point scale with a middle option, and nobody changes it.',
        again: 'Change my answer' },
  tr: { item: '“Kampüs yemekhanesinin yemekleri iyidir.”', group: 'Grup',
        A: ['Kesinlikle katılmıyorum', 'Katılmıyorum', 'Ne katılıyorum ne katılmıyorum', 'Katılıyorum', 'Kesinlikle katılıyorum'],
        B: ['Kesinlikle katılmıyorum', 'Katılmıyorum', 'Katılıyorum', 'Kesinlikle katılıyorum'],
        sawA: 'Sen ortası olan beş seçenek gördün. B grubu dört seçenek gördü ve bir tarafa yaslanmak zorunda kaldı.',
        sawB: 'Sen ortası olmayan dört seçenek gördün. A grubunda bir de “Ne katılıyorum ne katılmıyorum” vardı.',
        hands: 'Sınıfta sorulunca: A grubu, ortayı seçtiysen elini kaldır. B grubu, seçmekte zorlandıysan elini kaldır. Kararsızlar nereye gitti?',
        rule: 'Yanıt formatı yanıtları değiştirir. Bu yüzden bütün proje grupları ortası olan aynı 5’li ölçeği kullanıyor ve kimse onu değiştirmiyor.',
        again: 'Yanıtımı değiştir' }
};
function renderMid() {
  const S = MID[Kit.lang];
  const opts = S[grp];
  let h = `<span class="grp-badge">${esc(S.group)} ${grp}</span><p class="item-quote">${esc(S.item)}</p><div class="scale">`;
  opts.forEach((o, k) => {
    const on = midPick === k;
    h += `<button type="button" class="choice${on ? ' correct' : (midPick !== null ? ' dim' : '')}" data-k="${k}"${midPick !== null ? ' disabled' : ''}><span class="mark" aria-hidden="true">${on ? '✓' : k + 1}</span><span>${esc(o)}</span></button>`;

Kit.init();
Kit.tabs($('.seg'));
Kit.quiz($('#quizLv'), { items: lv, options: LV, labels: Kit.QUIZ_LABELS,
  summaryNote: { en: 'The level decides which statistics make sense: a mean needs at least interval data. Item analysis in your project uses means and correlations of item scores, so it treats them as roughly interval.', tr: 'Düzey, hangi istatistiğin anlamlı olduğunu belirler: ortalama için en az eşit aralıklı veri gerekir. Projenizdeki madde analizi madde puanlarının ortalamalarını ve korelasyonlarını kullanır; yani onları yaklaşık eşit aralıklı kabul eder.' } });
Kit.quiz($('#quizCl'), { items: clItems, labels: Kit.QUIZ_LABELS,
  summaryNote: { en: 'Now pick one item with your partner and write your own fix on paper. All of these rules are in the item-writing list for Milestone 2.', tr: 'Şimdi eşinle bir madde seç ve kendi düzeltmenizi kâğıda yazın. Bu kuralların hepsi T2’deki madde yazım kuralları listesinde var.' } });
Kit.quiz($('#quizSc'), { items: sq, options: SCM, labels: Kit.QUIZ_LABELS,
