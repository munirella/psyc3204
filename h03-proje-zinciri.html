<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ölçek zinciri · Scale chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F5; --card:#FFFFFF; --ink:#14213D; --muted:#7A8599; --line:#C3CDD8;
  --ok:#1E8A72; --weak:#C7362B; --aff:#C98A1A; --off:#A9B3C1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0F1624;--card:#172033;--ink:#E6EBF2;--muted:#8F9BB0;--line:#2E3C53;--ok:#4FC0A2;--weak:#F2766B;--aff:#E3B04B;--off:#55627A}
}
:root[data-theme="dark"]{--paper:#0F1624;--card:#172033;--ink:#E6EBF2;--muted:#8F9BB0;--line:#2E3C53;--ok:#4FC0A2;--weak:#F2766B;--aff:#E3B04B;--off:#55627A}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(22px,6vw,30px);letter-spacing:-0.01em}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}

/* pipeline */
.pipe{display:flex;align-items:center;gap:0;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.box{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
  padding:7px 9px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .3s,border-color .3s,color .3s}
.box small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.box.done{border-color:var(--ok)}
.box.cur{background:var(--ok);border-color:var(--ok);color:#fff}
.box.cur small{color:#ffffffcc}
.arrow{flex:0 0 18px;height:2px;background:var(--line);position:relative;margin:0 2px}
.arrow::after{content:"";position:absolute;right:-1px;top:-4px;border-left:7px solid var(--line);border-top:5px solid transparent;border-bottom:5px solid transparent}
.arrow.lit{background:var(--ok)} .arrow.lit::after{border-left-color:var(--ok)}

/* stage */
.stage{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px}
svg{display:block;width:100%;height:auto}
.it{transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .6s}
.it rect.sq{transition:fill .5s,stroke .5s}
.fade{transition:opacity .6s}
.dotp{transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .6s}
.needle{transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.ring{transition:stroke .5s,stroke-dasharray .5s,opacity .5s}
.cap{display:flex;align-items:center;gap:10px;min-height:48px}
.cap p{margin:0;font-size:17px;font-weight:700;flex:1;line-height:1.3}
.chip{flex-shrink:0;border-radius:999px;padding:5px 11px;font-weight:700;font-size:15px;background:var(--paper);border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.nav{display:flex;gap:10px}
.nav button{flex:1;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.nav button.next{background:var(--ink);color:var(--paper)}
.nav button:disabled{opacity:.35;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="top">
    <div><a id="hub" href="./" style="color:var(--muted);font-size:14px;text-decoration:none;font-weight:700"></a><h1 id="title"></h1></div>
    <div class="seg lang" role="group" aria-label="Dil / Language">
      <button type="button" data-l="tr">TR</button><button type="button" data-l="en">EN</button>
    </div>
  </div>

  <nav class="pipe" id="pipe" aria-label="Adımlar"></nav>

  <div class="stage">
    <svg viewBox="0 0 360 300" id="svg" role="img" aria-labelledby="capText">
      <!-- form sheet -->
      <rect id="sheet" class="fade" x="16" y="16" width="214" height="270" rx="12" fill="none" stroke="var(--line)" stroke-width="2" opacity="0"/>
      <!-- trash strip -->
      <g id="trash" class="fade" opacity="0">
        <line x1="20" y1="272" x2="340" y2="272" stroke="var(--weak)" stroke-width="1.5" stroke-dasharray="3 5"/>
        <text id="trashLbl" x="340" y="266" text-anchor="end" font-size="11" fill="var(--weak)" font-weight="700"></text>
      </g>
      <!-- construct target -->
      <g id="target" class="fade">
        <circle id="ring" class="ring" cx="180" cy="140" r="96" fill="none" stroke="var(--ok)" stroke-width="3"/>
        <circle id="core" cx="180" cy="140" r="96" fill="var(--ok)" opacity=".08" class="fade"/>
        <text id="tLbl" x="180" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ok)"></text>
        <g id="exdots" class="fade" opacity="0"></g>
      </g>
      <!-- people -->
      <g id="people" class="fade" opacity="0" transform="translate(300 26)"></g>
      <g id="items"></g>
      <g id="pdots"></g>
      <!-- gauge -->
      <g id="gauge" class="fade" opacity="0" transform="translate(296 190)">
        <path d="M-48 0 A48 48 0 0 1 48 0" fill="none" stroke="var(--line)" stroke-width="9" stroke-linecap="round"/>
        <path d="M-48 0 A48 48 0 0 1 -24 -41.6" fill="none" stroke="var(--weak)" stroke-width="9" stroke-linecap="round"/>
        <path d="M24 -41.6 A48 48 0 0 1 48 0" fill="none" stroke="var(--ok)" stroke-width="9" stroke-linecap="round"/>
        <g id="needle" class="needle" style="transform:rotate(-90deg)"><line x1="0" y1="0" x2="0" y2="-40" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></g>
        <circle r="5" fill="var(--ink)"/>
        <text x="0" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">α</text>
        <text id="gaugeLbl" x="0" y="40" text-anchor="middle" font-size="11" fill="var(--muted)"></text>
      </g>
      <!-- final card -->
      <g id="final" class="fade" opacity="0" transform="translate(296 66)">
        <rect x="-52" y="-42" width="104" height="84" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/>
        <rect x="-40" y="-30" width="80" height="44" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <g id="evid"></g>
        <line x1="0" y1="14" x2="0" y2="24" stroke="var(--ink)" stroke-width="2"/>
        <line x1="-14" y1="26" x2="14" y2="26" stroke="var(--ink)" stroke-width="2"/>
      </g>
    </svg>
  </div>

  <div class="cap" aria-live="polite"><p id="capText"></p><span class="chip" id="chip"></span></div>
  <div class="nav">
    <button type="button" id="prev"></button>
    <button type="button" class="next" id="next"></button>
  </div>
  <div class="legend" id="legend"></div>
</main>

<script>
const NS="http://www.w3.org/2000/svg";
const T={
 tr:{title:"Ölçeğiniz bir zincir",prev:"Geri",next:"İleri",again:"Baştan",
   target:"Tutum",trash:"elenen",gaugeOk:"(temsili)",item:"madde",
   steps:[["Konu","5 Ekim"],["T1 Tanım","13 Ekim"],["T2 Maddeler","25 Ekim"],["Panel","4 Kasım"],["Görüşme","4–17 Kasım"],["T3 Form","17/22 Kasım"],["Pilot","18 Kasım"],["Analiz","29 Kasım"],["Sunum","9–23 Aralık"]],
   cap:["Konu: bir tutum","Tanım: neyi ölçtüğünüz belli","15–20 madde yazılır","Panel: KGO düşük maddeler elenir","Görüşmeler: belirsiz maddeler düzeltilir","Son form: 10–12 madde","Pilot: ~28 yanıt","Analiz: zayıf maddeler çıkarılır (yeniden pilot yok)","Son ölçek ve sunum"],
   legend:[["var(--ok)","madde"],["var(--weak)","elenen"]]},
 en:{title:"Your scale is a chain",prev:"Back",next:"Next",again:"Restart",
   target:"Attitude",trash:"dropped",gaugeOk:"(illustrative)",item:"items",
   steps:[["Topic","Oct 5"],["M1 Definition","Oct 13"],["M2 Items","Oct 25"],["Panel","Nov 4"],["Interviews","Nov 4–17"],["M3 Form","Nov 17/22"],["Pilot","Nov 18"],["Analysis","Nov 29"],["Presentation","Dec 9–23"]],
   cap:["Topic: an attitude","Definition: clear about what you measure","15–20 items are written","Panel: items with low CVR are dropped","Interviews: unclear items are fixed","Final form: 10–12 items","Pilot: ~28 responses","Analysis: weak items are dropped (no new pilot)","Final scale and presentation"],
   legend:[["var(--ok)","item"],["var(--weak)","dropped"]]}
};

/* item model: 18 items -> panel drops 6 (12 in final form) -> analysis drops 2 (10) */
function model(){
  const it=[];
  for(let i=0;i<18;i++) it.push({on:true,cvr:false,unc:false,fixed:false,lowR:false,r:.45+((i*37)%10)/40});
  [1,4,9,11,15,16].forEach(i=>it[i].cvr=true);
  [2,8,13].forEach(i=>{it[i].unc=true;it[i].fixed=true});
  [6,17].forEach(i=>{it[i].lowR=true;it[i].r=.12});
  return it;
}

let lang="tr",stage=0,items=model();
try{const q=new URLSearchParams(location.search).get("lang");const s=localStorage.getItem("psyc3204.lang");
  if(q==="en"||q==="tr")lang=q;else if(s==="en"||s==="tr")lang=s;else lang=(navigator.language||"").toLowerCase().startsWith("tr")?"tr":"en";}catch(e){}

const $=id=>document.getElementById(id);
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};

/* build items */
const gItems=$("items"), nodes=[];
for(let i=0;i<18;i++){
  const g=el("g",{class:"it"});
  g.style.opacity=0; g.style.transform="translate(180px,140px) scale(0)";
  const sq=el("rect",{class:"sq",x:-10,y:-10,width:20,height:20,rx:4,"stroke-width":2});
  const line=el("rect",{x:18,y:-4,width:150,height:8,rx:4,fill:"var(--line)",opacity:0,class:"fade"});
  const bar=el("rect",{x:184,y:-7,width:0,height:14,rx:3,opacity:0,class:"fade"});
  bar.style.transition="width .8s,opacity .6s";
  const q=el("text",{x:0,y:5,"text-anchor":"middle","font-size":14,"font-weight":700,fill:"#fff",opacity:0,class:"fade"});q.textContent="?";
  const ck=el("path",{d:"M-5 0 L-1 4 L6 -4",fill:"none",stroke:"#fff","stroke-width":2.5,"stroke-linecap":"round",opacity:0,class:"fade"});
  g.append(sq,line,bar,q,ck); gItems.append(g); nodes.push({g,sq,line,bar,q,ck});
}
/* example dots for definition */
for(let k=0;k<7;k++){const a=k/7*Math.PI*2;$("exdots").append(el("circle",{cx:180+58*Math.cos(a),cy:140+58*Math.sin(a),r:4,fill:"var(--ok)"}))}
/* pilot dots */
const pd=[];for(let k=0;k<28;k++){const c=el("circle",{r:4,fill:"var(--ink)",class:"dotp"});c.style.opacity=0;c.style.transform=`translate(380px,${40+(k*23)%200}px)`;$("pdots").append(c);pd.push(c)}
/* people */
const ppl=[];for(let k=0;k<3;k++){const g=el("g",{class:"fade"});g.setAttribute("transform",`translate(${k*20-20} 0)`);
  g.append(el("circle",{cx:0,cy:-6,r:5,fill:"var(--ink)"}),el("path",{d:"M-8 10 Q0 -2 8 10 Z",fill:"var(--ink)"}));$("people").append(g);ppl.push(g)}
/* evidence bars on final */
const ev=[];for(let k=0;k<3;k++){const r=el("rect",{x:-26+k*20,y:0,width:12,height:0,rx:2,fill:"var(--ok)"});r.style.transition="height .8s, y .8s";$("evid").append(r);ev.push(r)}

function pos(){
  const P=[]; let inside=[],out=[];
  items.forEach((x,i)=>(x.on?inside:out).push(i));
  const cols=inside.length>9?6:4, rows=Math.ceil(inside.length/cols);
  inside.forEach((i,k)=>{const c=k%cols,r=Math.floor(k/cols);P[i]={x:180+(c-(cols-1)/2)*28,y:140+(r-(rows-1)/2)*30}});
  out.forEach((i,k)=>{const side=k%2,j=Math.floor(k/2);P[i]={x:side?334:26,y:66+j*36}});
  return P;
}

function apply(){
  const t=T[lang], S=stage;
  document.documentElement.lang=lang;
  $("title").textContent=t.title; $("hub").textContent=lang==="tr"?"← Tüm haftalar":"← All weeks"; $("hub").href="./?lang="+lang;
  document.title=t.title;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));

  /* pipeline */
  const pipe=$("pipe"); pipe.innerHTML="";
  t.steps.forEach((s,i)=>{
    if(i){const a=document.createElement("span");a.className="arrow"+(i<=S?" lit":"");pipe.append(a)}
    const b=document.createElement("button");b.type="button";b.className="box"+(i<S?" done":"")+(i===S?" cur":"");
    b.innerHTML=`${s[0]}<small>${s[1]}</small>`;b.onclick=()=>{stage=i;apply()};b.setAttribute("aria-current",i===S?"step":"false");pipe.append(b);
  });
  const cur=pipe.querySelector(".cur"); if(cur) cur.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});

  /* target */
  const targetVis=S<=4;
  $("target").style.opacity=targetVis?1:0;
  $("core").style.opacity=S>=1?.08:.03;
  $("tLbl").textContent=t.target;
  $("exdots").style.opacity=S===1?1:0;

  /* people: 3 panelists at stage 3, 2 interviewees at 4 */
  $("people").style.opacity=(S===3||S===4)?1:0;
  ppl[2].style.opacity=S===3?1:0;

  $("sheet").style.opacity=S>=5?1:0;
  $("trash").style.opacity=(S===3||S===4)?1:0; $("trashLbl").textContent=t.trash;

  /* items */
  const P=pos();
  const kept=items.map((x,i)=>i).filter(i=>!items[i].cvr);
  const final=kept.filter(i=>!items[i].lowR);
  nodes.forEach((n,i)=>{
    const x=items[i]; let tx=180,ty=140,sc=0,op=0,fill="var(--ok)",showQ=false,showCk=false,line=0,bar=0,barW=0;
    if(S>=2){op=1;sc=1;tx=P[i].x;ty=P[i].y;fill=x.on?"var(--ok)":"var(--off)"}
    if(S>=3&&x.cvr){fill="var(--weak)";if(S<=4){tx=30+i*17;ty=284;sc=.6;op=.55}else{op=0}}
    if(S===4&&!x.cvr&&x.unc){showQ=!x.fixed;showCk=x.fixed;fill=x.fixed?"var(--ok)":"var(--aff)"}
    if(S>=5&&!x.cvr){
      const list=S>=8?final:kept, k=list.indexOf(i);
      const n2=list.length, gap=Math.min(28,230/Math.max(n2,1));
      if(k>=0){tx=34;ty=36+k*gap;sc=.62;op=1;line=1}
      else{tx=34;ty=300;op=0;sc=.62}
      fill=(x.unc&&!x.fixed)?"var(--aff)":"var(--ok)";
      if(S>=7){bar=1;barW=Math.round(x.r*95)}
      if(S===7&&x.lowR)fill="var(--weak)";
    }
    n.g.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
    n.g.style.opacity=op;
    n.sq.setAttribute("fill",fill);n.sq.setAttribute("stroke",fill);
    n.q.style.opacity=showQ?1:0; n.ck.style.opacity=showCk?1:0;
    n.line.style.opacity=line?1:0;
    n.bar.style.opacity=bar?1:0; n.bar.setAttribute("width",barW);
    n.bar.setAttribute("fill",x.lowR?"var(--weak)":"var(--ok)");
  });

  /* pilot dots */
  pd.forEach((c,k)=>{
    if(S===6){c.style.opacity=1;c.style.transform=`translate(${262+(k%5)*18}px,${44+Math.floor(k/5)*22}px)`}
    else if(S>6){c.style.opacity=0;c.style.transform=`translate(120px,140px)`}
    else{c.style.opacity=0;c.style.transform=`translate(380px,${40+(k*23)%200}px)`}
  });

  /* gauge */
  $("gauge").style.opacity=S>=7?1:0;
  $("needle").style.transform=`rotate(${S>=7?58:-90}deg)`;
  $("gaugeLbl").textContent=t.gaugeOk;
  $("final").style.opacity=S===8?1:0;
  const lv=[12,22,32];
  ev.forEach((r,k)=>{const h=S===8?lv[k]:0;r.setAttribute("height",h);r.setAttribute("y",10-h);r.setAttribute("fill","var(--ok)")});

  /* caption & chip */
  $("capText").textContent=t.cap[S];
  const count=S<2?"":(S<=2?18:S<=6?kept.length:S===7?kept.length:final.length);
  const prevCount=S===3?18:S===8?kept.length:null;
  $("chip").textContent=count===""?"–":(prevCount&&prevCount!==count?`${prevCount} → ${count} ${t.item}`:`${count} ${t.item}`);

  $("prev").textContent=t.prev; $("prev").disabled=S===0;
  $("next").textContent=S===8?t.again:t.next;
  $("legend").innerHTML=t.legend.map(([c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join("");
}

$("prev").onclick=()=>{if(stage>0){stage--;apply()}};
$("next").onclick=()=>{stage=stage===8?0:stage+1;apply()};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("psyc3204.lang",lang)}catch(e){}apply()});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()});
apply();
</script>
</body>
</html>
